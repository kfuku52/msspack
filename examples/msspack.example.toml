[project]
name = "MySubmission"
output_dir = "build/MySubmission"

[inputs]
fasta = "/absolute/path/to/reference.fa"
gff = "/absolute/path/to/annotation.gff"

[sample]
locus_tag = "MyTag"
locus_tag_digits = 6
scientific_name = "Genus species"
strain = ""
isolate = ""
geo_loc_name = "Japan"
collection_date = "2026-01-01"
sex = ""
linkage_evidence = "proximity ligation"
genetic_code = "1"

[submission]
datatype = "WGS"
hold_date = "20261231"
bioproject = "PRJDB00000"
biosample = "SAMD00000000"
sra = ["DRR000000"]
keywords = ["WGS", "STANDARD_DRAFT"]

[submitter]
ab_name = ["Doe,J."]
contact = "Jane Doe"
institute = "Institute"
department = "Department"
country = "Japan"
state = "State"
city = "City"
street = "Street Address"
zip = "000-0000"
phone = "00-00-0000-0000"
email = "your.email@example.org"

[reference]
title = "Genome sequencing"
ab_name = ["Doe,J."]
year = 2026
status = "Unpublished"

[st_comment]
tagset_id = "Genome-Assembly-Data"
assembly_method = "Assembler 1.0"
assembly_name = "MyAssembly_1.0"
genome_coverage = "100X"
sequencing_technology = "Sequencer"

[pipeline]
run_gapjust = true
gap_assembly = "unknown"
infer_complete = true
validate_in_parallel = true
feature_with_gap = "misc_feature"
min_assembly_gap = 50
min_artificial_intron_size = 10
replace_product_patterns = [
  "\\) transport protein",
  "18S rRNA",
  "Cullin-1",
  "Cullin-3A",
  "Cullin-4",
]

[databases]
# Relative paths are resolved from this TOML file. Use an absolute shared path
# to reuse the same databases safely across projects and cluster jobs.
root = "msspack_db"
# Lock intervals must be finite and positive; stale must be greater than heartbeat.
lock_poll_seconds = 5
lock_timeout_seconds = 86400
lock_heartbeat_seconds = 60
lock_stale_seconds = 900

[functional_annotation]
# Opt-in AHRD-like product assignment. Databases are downloaded once into
# databases.root unless local database paths are supplied.
enabled = false
diamond_command = "diamond"
hmmscan_command = "hmmscan"
hmmpress_command = "hmmpress"
rpsblast_command = "rpsblast"
rpsbproc_command = "rpsbproc"
threads = 8
sensitivity = "sensitive"
evalue = 1e-10
max_target_seqs = 25
min_bitscore = 50.0
min_identity = 35.0
min_query_coverage = 70.0
min_subject_coverage = 70.0
near_top_bitscore_ratio = 0.90
min_token_score = 0.60
overwrite_existing = false
swissprot_enabled = true
swissprot_fasta = ""
swissprot_url = "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot.fasta.gz"
swissprot_weight = 1.0
uniref90_enabled = false
uniref90_fasta = ""
uniref90_url = "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref90/uniref90.fasta.gz"
# Optional taxonomic subset obtained from the UniProt REST API; 0 means full UniRef90.
uniref90_taxon_id = 0
uniref90_weight = 0.5
reference_proteins = ""
reference_name = "reference"
reference_weight = 1.2
pfam_enabled = true
pfam_hmm = ""
pfam_url = "https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.hmm.gz"
pfam_max_i_evalue = 1e-5
pfam_min_domain_coverage = 0.35
cdd_enabled = false
cdd_database = ""
cdd_url = "https://ftp.ncbi.nlm.nih.gov/pub/mmdb/cdd/little_endian/Cdd_LE.tar.gz"
cdd_data_dir = ""
cdd_data_url = "https://ftp.ncbi.nlm.nih.gov/pub/mmdb/cdd"
cdd_evalue = 0.01

[functional_annotation.taxonomy]
# Resolve sample.scientific_name through NCBI Taxonomy and use BUSCO lineage
# results as a cross-check/fallback. Set target_taxon_id to override name lookup.
enabled = true
target_taxon_id = 0
resolve_scientific_name = true
offline = false
busco_crosscheck = true
strict = false
distant_specificity_identity = 50.0

[functional_annotation.consistency]
# Optional family-level name audit. One DIAMOND all-vs-all search is reused for
# near-identical, close-family, and broad-homology sensitivity thresholds.
enabled = false
# When true, only approved aliases and safe formatting variants in near-identical
# families are harmonized. Specificity, paralog, substrate, and localization
# differences are retained as evidence-resolved family variation.
harmonize_safe_equivalents = false
# Resolve conflicts without manual review: propagate a unique higher-priority
# product only across near-identical proteins; otherwise retain independently
# supported paralog/subfamily-specific names.
auto_resolve_conflicts = true
near_identical_identity = 90.0
near_identical_coverage = 90.0
family_identity = 70.0
family_coverage = 80.0
broad_identity = 40.0
broad_coverage = 60.0
evalue = 1e-10
name_similarity_threshold = 0.45
source_pair_min_pairs = 5

[busco]
command = "busco"
run_cds = true
run_genome = false
mode = "genome"
cds_mode = "transcriptome"
lineage_dataset = ""
auto_lineage = true
auto_lineage_scope = "all"
threads = 8
# Leave empty to use databases.root/busco.
download_path = ""
offline = false
force = false
opt_out_run_stats = true
