[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msspack = ["templates/*.toml"]

[project]
name = "msspack"
dynamic = ["version"]
description = "Build DDBJ MSS submission files from FASTA/GFF inputs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Kenji Fukushima"},
]
dependencies = [
  "biopython",
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11,<1.19",
  "ruff>=0.11",
  "tomli>=1.1.0",
]

[project.scripts]
msspack = "msspack.cli:main"

[tool.setuptools.dynamic]
version = {attr = "msspack.__version__"}

[tool.ruff]
extend-exclude = ["build", ".venv"]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
allow_redefinition = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["Bio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tomllib"]
ignore_missing_imports = true
