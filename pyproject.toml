[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msspack = ["py.typed", "templates/*.toml"]

[project]
name = "msspack"
dynamic = ["version"]
description = "Build DDBJ MSS submission files from FASTA/GFF inputs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "Kenji Fukushima"},
]
dependencies = [
  "biopython>=1.87",
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "check-wheel-contents>=0.6",
  "mypy>=1.19",
  "pip-audit>=2.10",
  "ruff>=0.11",
  "tomli>=1.1.0",
  "twine>=6.0",
]

[project.scripts]
msspack = "msspack.cli:main"

[tool.setuptools.dynamic]
version = {attr = "msspack.__version__"}

[tool.ruff]
extend-exclude = ["build", ".venv"]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
allow_redefinition = true
strict = true

[[tool.mypy.overrides]]
module = ["Bio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tomllib"]
ignore_missing_imports = true
